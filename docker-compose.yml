services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_transport_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - smart_transport

  nginx:
    image: nginx:alpine
    container_name: smart_transport_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - smart_transport

  db:
    image: mysql:8.0
    container_name: smart_transport_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_transport
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: smart_user
      MYSQL_PASSWORD: smart_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - smart_transport

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: smart_transport_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - smart_transport

networks:
  smart_transport:
    driver: bridge

volumes:
  db_data:
    driver: local
